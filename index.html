* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Base Sans Mono', monospace; color: #fff; }

.screen { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.55s ease; display: flex; }
.screen.active { opacity: 1; pointer-events: all; }

/* ── Intro ── */
#s-intro { background: #1c1c23; align-items: center; justify-content: center; cursor: pointer; }
#intro-video { width: auto; height: auto; max-width: min(780px, 90vw); max-height: 80vh; object-fit: contain; }

/* ── Input ── */
#s-input { background: #1c1c23; flex-direction: column; align-items: center; justify-content: center; }

.s-logo { position: absolute; top: 51px; left: 60px; width: 114px; height: 37px; }
.union-icon { width: 72px; height: 93px; margin-bottom: 32px; display: block; }

.headline {
  font-size: clamp(22px, 2.8vw, 43px); font-weight: 400;
  letter-spacing: 0.04em; text-transform: uppercase;
  text-align: center; line-height: 1.25;
  margin-bottom: 20px; max-width: 500px;
}
.subtext {
  font-size: clamp(11px, 1.3vw, 19px);
  letter-spacing: 0.04em; text-transform: uppercase;
  text-align: center; line-height: 1.7;
  margin-bottom: 28px; opacity: 0.65;
}

.input-row {
  display: flex; width: min(567px, 90vw); height: 72px;
  border-radius: 14px; background: #d9d9d9; position: relative;
  padding: 6px; align-items: center; gap: 0;
}
.input-at {
  position: absolute; left: 22px; top: 50%; transform: translateY(-50%);
  font-family: 'Base Sans Mono', monospace; font-size: 28px; color: #000;
  letter-spacing: 0.04em; pointer-events: none; z-index: 2; line-height: 1; user-select: none;
}
#username-input {
  flex: 1; background: transparent; border: none; outline: none;
  padding: 0 10px 0 50px;
  font-family: 'Base Sans Mono', monospace; font-size: 22px; color: #000;
  letter-spacing: 0.04em; text-transform: uppercase; min-width: 0; height: 100%;
}
#username-input::placeholder { color: rgba(0,0,0,0.25); }
#make-btn {
  min-width: 210px; height: 100%; background: #7575ff; border: none; outline: none;
  cursor: pointer; font-family: 'Base Sans Mono', monospace;
  font-size: clamp(12px, 1.25vw, 19px); color: #fff;
  letter-spacing: 0.04em; text-transform: uppercase;
  border-radius: 10px; flex-shrink: 0; transition: opacity 0.2s;
  padding: 0 36px;
}
#make-btn:hover { opacity: 0.85; }
#make-btn:disabled { opacity: 0.5; cursor: wait; }
@media (max-width: 540px) {
  .btn-text { display: none; }
  #make-btn { min-width: 52px; padding: 0 18px; font-size: 26px; }
  .s-logo { width: 57px; height: 18.5px; top: 24px; left: 24px; }
}

/* ── Result ── */
#s-result {
  background: #000; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px; padding: 60px 16px 16px;
}
#card-wrap { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
#card {
  width: 1043.61px; height: 587.03px;
  background: #1c1c23; position: relative; overflow: hidden;
  box-shadow: 0 14px 250px 0 #7575ff;
  transform-origin: center center; flex-shrink: 0;
}

.b-top {
  position: absolute; pointer-events: none;
  width: 1066.44px; height: 193.98px;
  left: calc(50% + 0.14px); top: -96.99px;
  transform: translateX(-50%);
}
.b-bot {
  position: absolute; pointer-events: none;
  width: 1066.44px; height: 193.98px;
  left: calc(50% + 0.14px); top: 433.31px;
  transform: translateX(-50%);
}

/* Profile circle: CSS ring via box-shadow, clip via overflow */
.p-area {
  position: absolute;
  width: 370px; height: 370px;
  left: 50%; top: calc(50% - 13.1px);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 0 16px #7575ff;
  background: #2a2a36;
}
#profile-img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  border-radius: 50%;
  /* no crossorigin attr — set via JS only when needed for canvas */
}

.c-left {
  position: absolute; pointer-events: none;
  left: 35.32px; top: calc(50% - 27.72px);
  width: 250.79px; font-size: 23.187px;
  letter-spacing: 0.04em; text-transform: uppercase;
  line-height: 1.28; color: #fff;
}
.c-pill {
  position: absolute;
  left: 757.5px; top: calc(50% - 34.45px);
  width: 315.025px; height: 68.905px;
  background: #7575ff; border-radius: 5.435px;
  display: flex; align-items: center; justify-content: flex-start;
  padding-left: 20px;
}
#card-uname {
  font-size: 25.322px; letter-spacing: 0.04em;
  text-transform: uppercase; color: #fff; white-space: nowrap;
}

.result-actions { display: flex; gap: 18px; flex-shrink: 0; flex-wrap: wrap; justify-content: center; }
.abtn {
  height: 49.37px; border-radius: 10px;
  font-family: 'Base Sans Mono', monospace; font-size: 19.433px;
  letter-spacing: 0.04em; text-transform: uppercase;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px;
  padding: 0 22px; transition: opacity 0.2s; white-space: nowrap;
}
.abtn:hover { opacity: 0.82; }
#share-btn { background: #7575ff; color: #fff; border: none; min-width: 200px; }
#dl-btn { background: transparent; color: #fff; border: 3px solid #7575ff; min-width: 250px; }
#dl-btn:disabled { opacity: 0.5; cursor: wait; }

.back-btn {
  background: none; border: none; outline: none; cursor: pointer;
  font-family: 'Base Sans Mono', monospace; font-size: 15px;
  letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255,255,255,0.55);
  text-decoration: none; padding: 6px 0; flex-shrink: 0; transition: color 0.2s;
}
.back-btn:hover { text-decoration: underline; color: #fff; }
</style>
</head>

let uname = '';
let profileSrc = '';

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 's-result') scaleCard();
}

function scaleCard() {
  const card = document.getElementById('card');
  const avW = window.innerWidth * 0.90;
  const avH = (window.innerHeight - 120) * 0.70;
  const scale = Math.min(avW / 1043.61, avH / 587.03, 1);
  card.style.transform = `scale(${scale})`;
  const wrap = document.getElementById('card-wrap');
  wrap.style.width  = (1043.61 * scale) + 'px';
  wrap.style.height = (587.03  * scale) + 'px';
}
window.addEventListener('resize', () => {
  if (document.getElementById('s-result').classList.contains('active')) scaleCard();
});

// Intro
const vid = document.getElementById('intro-video');
vid.play().catch(() => showScreen('s-input'));
vid.addEventListener('ended', () => showScreen('s-input'));
document.getElementById('s-intro').addEventListener('click', () => showScreen('s-input'));
document.addEventListener('keydown', () => {
  if (document.getElementById('s-intro').classList.contains('active')) showScreen('s-input');
});

// Make image — no fetch needed, <img src> works across origins
function go() {
  const raw = document.getElementById('username-input').value.trim().replace(/^@/, '');
  if (!raw) return;
  uname = raw;

  // Direct URL — <img> loads external images without CORS restrictions
  profileSrc = `https://unavatar.io/x/${encodeURIComponent(raw)}`;

  const img = document.getElementById('profile-img');
  img.src = profileSrc;
  img.onerror = () => {
    // Fallback: generated letter avatar
    img.onerror = null;
    img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(raw)}&size=346&background=2a2a36&color=7575ff&bold=true`;
  };

  const unameEl = document.getElementById('card-uname');
  unameEl.textContent = '@' + raw.toUpperCase();
  // Shrink font to fit pill (max width ~275px to account for 20px padding)
  let fs = 25.322;
  unameEl.style.fontSize = fs + 'px';
  while (unameEl.scrollWidth > 255 && fs > 10) {
    fs -= 0.5;
    unameEl.style.fontSize = fs + 'px';
  }
  showScreen('s-result');
}
document.getElementById('make-btn').addEventListener('click', go);
document.getElementById('username-input').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

// ── Shared helpers ────────────────────────────────────────────────────────────
function loadImg(src, crossOrigin) {
  return new Promise((res, rej) => {
    const i = new Image();
    if (crossOrigin) i.crossOrigin = crossOrigin;
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = src;
  });
}

function wrapText(ctx, text, x, y, maxW, lh) {
  const words = text.split(' ');
  let line = '';
  for (const w of words) {
    const t = line + w + ' ';
    if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line.trim(), x, y); line = w + ' '; y += lh; }
    else line = t;
  }
  if (line.trim()) ctx.fillText(line.trim(), x, y);
}

function showToast(msg) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div'); t.id = '_toast';
    Object.assign(t.style, {
      position:'fixed', bottom:'36px', left:'50%', transform:'translateX(-50%)',
      background:'#7575ff', color:'#fff', padding:'12px 28px',
      borderRadius:'10px', fontFamily:'"Base Sans Mono",monospace',
      fontSize:'15px', letterSpacing:'.05em', textTransform:'uppercase',
      zIndex:'9999', transition:'opacity .4s', pointerEvents:'none', opacity:'0',
      whiteSpace:'nowrap'
    });
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._tid);
  t._tid = setTimeout(() => { t.style.opacity = '0'; }, 3500);
}

// Renders the card to a canvas and returns it
async function renderCard() {
  const DPR = 2, W = 1043.61, H = 587.03;
  const cv = document.createElement('canvas');
  cv.width = W * DPR; cv.height = H * DPR;
  const ctx = cv.getContext('2d');
  ctx.scale(DPR, DPR);

  await document.fonts.load('24px "Base Sans Mono"');

  // Background
  ctx.fillStyle = '#1c1c23';
  ctx.fillRect(0, 0, W, H);

  // BATCHES text (embedded data URLs — no CORS)
  const ts = await loadImg(BTOP);
  ctx.drawImage(ts, (W - 1066.44) / 2 + 0.14, -96.99, 1066.44, 193.98);
  const bs = await loadImg(BBOT);
  ctx.drawImage(bs, (W - 1066.44) / 2 + 0.14, 433.31, 1066.44, 193.98);

  // Profile picture
  const cx = W / 2, cy = H / 2 - 13.1, r = 185;
  if (profileSrc) {
    try {
      const pi = await loadImg(profileSrc + '?_cb=' + Date.now(), 'anonymous');
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
      ctx.drawImage(pi, cx - r, cy - r, r * 2, r * 2);
      ctx.restore();
    } catch {
      ctx.fillStyle = '#2a2a36';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Purple ring
  ctx.strokeStyle = '#7575ff'; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.arc(cx, cy, r + 8, 0, Math.PI * 2); ctx.stroke();

  // Purple pill
  ctx.fillStyle = '#7575ff';
  const px = 757.5, py = H / 2 - 34.45, pw = 315.025, ph = 68.905;
  ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 5.435); ctx.fill();

  // Left text (two fixed lines)
  ctx.fillStyle = '#fff'; ctx.font = '23.187px "Base Sans Mono"';
  ctx.letterSpacing = '0.9px'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillText('I APPLIED TO', 35.32, H / 2 - 27.72);
  ctx.fillText('BASE BATCHES 004', 35.32, H / 2 - 27.72 + 29);

  // Username in pill — shrink font to fit
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.letterSpacing = '1px';
  let ufs = 25.322;
  const maxPillW = pw - 60; // 20px left, 40px right
  const unameText = '@' + uname.toUpperCase();
  ctx.font = `${ufs}px "Base Sans Mono"`;
  while (ctx.measureText(unameText).width > maxPillW && ufs > 10) {
    ufs -= 0.5;
    ctx.font = `${ufs}px "Base Sans Mono"`;
  }
  ctx.fillText(unameText, px + 20, py + ph / 2);

  return cv;
}

// Converts canvas to Blob
function canvasToBlob(cv) {
  return new Promise(res => cv.toBlob(res, 'image/png'));
}

// Triggers a file download from a blob
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

// ── Share on X ────────────────────────────────────────────────────────────────
document.getElementById('share-btn').addEventListener('click', async () => {
  const btn = document.getElementById('share-btn');
  const origHtml = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Generating…';
  try {
    const cv = await renderCard();
    const blob = await canvasToBlob(cv);
    const filename = `base-batches-004-${uname}.png`;
    const tweetText = `I applied to Base Batches 004! @base #BaseBatches004

[Image is copied to your clipboard. Please press ctrl or command & v to paste it, then remove this note.]`;

    // Try Web Share API (native on mobile, some desktop browsers)
    // Copy image to clipboard, then open tweet dialog
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`, '_blank');
      showToast('Image copied — paste it into your tweet!');
    } catch {
      // Clipboard write blocked — fall back to download
      triggerDownload(blob, filename);
      await new Promise(r => setTimeout(r, 400));
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`, '_blank');
      showToast('Image saved — attach it to your tweet!');
    }
  } catch(e) {
    if (e.name !== 'AbortError') { console.error(e); alert('Something went wrong. Try again.'); }
  } finally {
    btn.disabled = false; btn.innerHTML = origHtml;
  }
});

// ── Download Image ────────────────────────────────────────────────────────────
document.getElementById('back-btn').addEventListener('click', () => showScreen('s-input'));

// ── Download Image ────────────────────────────────────────────────────────────
document.getElementById('dl-btn').addEventListener('click', async () => {
  const btn = document.getElementById('dl-btn');
  const origHtml = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Rendering…';
  try {
    const cv = await renderCard();
    const blob = await canvasToBlob(cv);
    triggerDownload(blob, `base-batches-004-${uname}.png`);
  } catch(e) {
    console.error(e); alert('Download failed. Please try again.');
  } finally {
    btn.disabled = false; btn.innerHTML = origHtml;
  }
});
